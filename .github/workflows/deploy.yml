name: 🚀 Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Build the React/Vite Frontend
  # ─────────────────────────────────────────────────────────────────
  build-frontend:
    name: 🔨 Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_SOCKET_URL: /
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Deploy to AWS EC2
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          # Copy backend source (excluding node_modules, .env, uploads, logs)
          mkdir -p deploy_package/backend
          rsync -av \
                --exclude='node_modules' \
                --exclude='.env' \
                --exclude='uploads/' \
                --exclude='*.log' \
                --exclude='whatsapp_session/' \
                backend/ deploy_package/backend/

          # Copy frontend build
          mkdir -p deploy_package/frontend
          cp -r frontend/dist/ deploy_package/frontend/dist/

          # Copy scripts directory
          mkdir -p deploy_package/scripts
          cp -r scripts/* deploy_package/scripts/

      - name: Transfer files to EC2
        run: |
          DEPLOY_PATH="/home/ec2-user/mykiranam"

          # Ensure remote directories exist
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.AWS_HOST }} \
              "mkdir -p ${DEPLOY_PATH}/backend ${DEPLOY_PATH}/frontend"

          # Sync backend code
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='uploads/' \
            --exclude='whatsapp_session/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy_package/backend/ \
            ec2-user@${{ secrets.AWS_HOST }}:${DEPLOY_PATH}/backend/

          # Sync frontend dist
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy_package/frontend/dist/ \
            ec2-user@${{ secrets.AWS_HOST }}:${DEPLOY_PATH}/frontend/dist/

          # Sync scripts
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            deploy_package/scripts/ \
            ec2-user@${{ secrets.AWS_HOST }}:${DEPLOY_PATH}/scripts/

      - name: Configure .env on server
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.AWS_HOST }} \
              "cat > /home/ec2-user/mykiranam/backend/.env << 'ENVEOF'
          PORT=5001
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USER=${{ secrets.EMAIL_USER }}
          SMTP_PASS=${{ secrets.EMAIL_PASS }}
          NODE_ENV=production
          ENVEOF"

      - name: Install dependencies & restart services on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ec2-user@${{ secrets.AWS_HOST }} << 'SSHEOF'
          set -e

          echo "📦 Installing backend dependencies..."
          cd /home/ec2-user/mykiranam/backend
          npm install --omit=dev

          echo "🔄 Restarting backend with PM2..."
          if pm2 list | grep -q "kiranam-backend"; then
            pm2 restart kiranam-backend --update-env
          else
            pm2 start server.js --name kiranam-backend --env production
            pm2 save
          fi

          echo "🌐 Fixing Nginx Proxy Port and Reloading..."
          sudo cp /home/ec2-user/mykiranam/scripts/nginx.conf /etc/nginx/conf.d/mykiranam.conf
          sudo sed -i 's/5000/5001/g' /etc/nginx/conf.d/mykiranam.conf || true
          sudo nginx -t && sudo systemctl reload nginx

          echo "✅ Deployment complete!"
          pm2 status
          SSHEOF

      - name: Health check
        run: |
          echo "⏳ Waiting for server to warm up..."
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            http://${{ secrets.AWS_HOST }}/api/health || echo "000")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "404" ]; then
            echo "✅ Server is responding!"
          else
            echo "⚠️ Server returned $HTTP_STATUS — check PM2 logs on EC2"
          fi
